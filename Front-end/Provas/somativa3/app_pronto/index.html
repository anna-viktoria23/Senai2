<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Minha Lista de Filmes</title>
</head>
<body>

  <header id="topo">
    <h1>🎬 Lista de Filmes da Anna Viktoria</h1>
    <p>Cadastre os filmes que você assistiu e dê sua nota.</p>
  </header>

  <main>
    <section id="secao-cadastro">
      <h2>Cadastrar novo filme</h2>

      <form id="form-filme">
        <label for="input-titulo">Título</label>
        <input type="text" id="input-titulo" required />

        <label for="input-diretor">Diretor</label>
        <input type="text" id="input-diretor" required />

        <label for="input-nota">Nota (1 a 5)</label>
        <input type="number" id="input-nota" min="1" max="5" required />

        <label for="input-genero">Genero</label>
        <input type="text" id="input-genero" required>


        <label for="input-comentario">Comentário</label>
        <textarea id="input-comentario" rows="3" required></textarea>

        <button type="submit">Adicionar filme</button>
      </form>
    </section>

    <section id="secao-lista">
      <h2>Meus filmes</h2>

      <p id="contador"> Você tem 0 itens na sua lista</p>


      <ul id="lista-filmes"></ul>
      <p id="msg-vazio">Você ainda não cadastrou nenhum filme.</p>

      <button id="btn-limpar">Limpar tudo</button>


    </section>
  </main>

  <footer>
    <p>Somativa Aula 10 — SENAI Itu — 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
