<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/styles/global.css" />
    
    <title>Document</title>
</head>

<body>
    <header id="topo-loja">
        <h1 id="titulo-site">TachFood - Sabor & Saber</h1>
        <p id="boas-vidas">Carregando...</p>

        <input type="checkbox" id="bt_menu" />
        <label for="bt_menu" id="label-menu" aria-label="Abrir menu">
            &#9776;
        </label>

        <nav id="menu">
        <ul>
          <li><a href="#grid-cardapio">Cardápio</a></li>
          <li><a href="pedidos.html">Meus Pedidos</a></li>
          <li><a href="cadastro.html">Cadastrar Prato</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="secao-cadastro">
        <h2 class="titulo-secao">Cadastrar Novo Prato</h2>

        <form id="form-cadastro-prato" enctype="multipart/form-data">
          <div class="campo-formulario">
            <label for="nome">Nome do Prato</label>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Ex: Hambúrguer Artesanal"
              required
            />
          </div>

          <div class="campo-formulario">
            <label for="descricao">Descrição</label>
            <textarea
              id="descricao"
              name="descricao"
              rows="4"
              placeholder="Descreva o prato..."
              required
            ></textarea>
          </div>

          <div class="campo-formulario">
            <label for="preco">Preço (R$)</label>
            <input
              type="number"
              id="preco"
              name="preco"
              min="0"
              placeholder="0,00"
            />
          </div>

          <div class="campo-formulario">
            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria" required>
              <option value="">Selecione</option>
              <option value="Lanche">Lanche</option>
              <option value="Pizza">Pizza</option>
              <option value="Bebida">Bebida</option>
              <option value="Sobremesa">Sobremesa</option>
            </select>
          </div>

          <button type="submit" id="btn-cadastrar">
            Cadastrar Prato
          </button>
        </form>

        <div id="mensagem"></div>
      </section>
    </main>


</body>
</html>
